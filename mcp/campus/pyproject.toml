[project]
name = "campus-coach-mcp"
version = "0.1.0"
description = "Read-only MCP server for Campus Coach (campus.coach) training data"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.27",
    "truststore>=0.9",
]

[project.scripts]
campus-coach-mcp = "campus_coach_mcp.server:main"
campus-coach-auth = "campus_coach_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_coach_mcp"]
