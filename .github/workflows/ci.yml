name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mcp-campus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/campus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Le serveur expose ses outils
        run: uv run --frozen python -c "import campus_coach_mcp.server as s; tools = sorted(t.name for t in s.mcp._tool_manager.list_tools()); print(tools); assert len(tools) == 9"

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Le Bicep compile
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
